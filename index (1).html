document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('pass'), b=document.getElementById('go'), m=document.getElementById('message');b.disabled=true;m.textContent='Decrypting locally…';try{if(!crypto.subtle)throw new Error('Use HTTPS in a modern browser.');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytesFromBase64(PAYLOAD.salt),iterations:PAYLOAD.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytesFromBase64(PAYLOAD.iv)},key,bytesFromBase64(PAYLOAD.data));p.value='';const page=new TextDecoder('utf-8',{fatal:true}).decode(plain);document.open();document.write(page);document.close();}catch(err){m.textContent=err.name==='OperationError'?'Incorrect passphrase. Please try again.':('Unable to unlock: '+err.message);b.disabled=false;p.focus();}});
